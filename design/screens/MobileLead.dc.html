<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile web: my leads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1D1822;background:#F5F3F7}
a{color:#6B3585}a:hover{color:#4F2563}
.side a{display:flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:#D6CEDE;text-decoration:none}
.side a:hover{color:#FFFFFF;background:#2E2735}
.side a.on{color:#FFFFFF;background:#8B4FA8;font-weight:600}
.card{background:#FFFFFF;border:1px solid #E4DFE9;border-radius:14px;padding:18px;box-sizing:border-box}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.ig{color:#8E2C5A;background:#F9E6EF}.wa{color:#17654A;background:#E4F3EC}.ad{color:#8F4312;background:#FBEEE3}.crm{color:#244B8A;background:#E6EDF8}.ai{color:#4F2563;background:#F1E8F6}.mut{color:#5E5566;background:#F1EEF4}.ok{color:#17654A;background:#E4F3EC}.warn{color:#8F4312;background:#FBEEE3}.bad{color:#9B1C1C;background:#FBE7E7}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid #D3CADB;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#1D1822;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btnp{height:38px;padding:0 16px;border-radius:8px;border:none;background:#8B4FA8;font:inherit;font-size:13px;font-weight:600;color:#FFFFFF;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5E5566}
.muted{color:#5E5566}
.h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:28px}
.h2{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px}
.inp{height:38px;border:1px solid #D3CADB;border-radius:8px;padding:0 12px;font:inherit;font-size:13px;box-sizing:border-box;width:100%;background:#FFFFFF;color:#1D1822}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5E5566;padding:9px 10px;border-bottom:1px solid #E4DFE9}
.tbl td{padding:10px;border-bottom:1px solid #F0ECF3;vertical-align:middle}
.av{width:30px;height:30px;border-radius:50%;background:#F1E8F6;color:#6B3585;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tog{width:36px;height:20px;border-radius:999px;background:#B8ADC2;position:relative;display:inline-block;flex-shrink:0;border:none;padding:0;cursor:pointer}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF}
.tog.on{background:#1D7A55}.tog.on::after{left:18px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.stat{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:700}
.bar{height:8px;border-radius:999px;background:#EFEAF3;overflow:hidden}
.bar span{display:block;height:100%;background:#8B4FA8;border-radius:999px}
.small{font-size:12px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0ECF3;font-size:13px}
.dd{position:relative;display:inline-block}
.dd>summary{list-style:none;cursor:pointer}
.dd>summary::-webkit-details-marker{display:none}
.dd .menu{position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:210px;max-height:320px;overflow:auto;background:#FFFFFF;border:1px solid #E4DFE9;border-radius:10px;box-shadow:0 10px 30px rgba(29,24,34,.16);padding:6px;display:flex;flex-direction:column;gap:1px}
.dd.r .menu{left:auto;right:0}
.dd .menu>*{display:block;width:100%;text-align:left;border:none;background:none;font:inherit;font-size:13px;font-weight:500;color:#1D1822;padding:8px 10px;border-radius:6px;text-decoration:none;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.dd .menu>*:hover{background:#F5F3F7;color:#1D1822}
.dd .menu .sel{font-weight:700;color:#6B3585}
.dd .menu .sep{height:1px;padding:0;margin:4px 0;background:#E4DFE9}
.side .dd{display:block}
.side .dd .menu a{color:#1D1822;height:auto}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F3F7; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1D1822; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column">
<div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #1D1822; color: #FFFFFF"><div style="width: 28px; height: 28px; border-radius: 8px; background: #8B4FA8; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700">Z</div><b style="font-size: 15px">My leads</b><span class="chip bad" style="margin-left: auto">1 due now</span></div>
<div style="flex-grow: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<div class="row" style="gap: 6px"><span class="chip crm">Today · 6</span><span class="chip mut">Appointments · 2</span><span class="chip mut">Overdue · 1</span></div>
<sc-for list="{{leads}}" as="l" hint-placeholder-count="5"><div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 8px"><div class="row"><b style="font-size: 15px">{{l.n}}</b><span class="chip {{l.c}}" style="margin-left: auto">{{l.s}}</span></div><span class="small muted" style="line-height: 1.45">{{l.d}}</span><div class="row"><a href="Calls.dc.html" class="btnp" style="flex-grow: 1; height: 44px">Call</a><a href="Inbox.dc.html" class="btn" style="flex-grow: 1; height: 44px">WhatsApp</a><a href="LeadProfile.dc.html" class="btn" style="height: 44px">Open</a></div></div></sc-for>
</div>
<nav aria-label="Mobile" style="height: 64px; flex-shrink: 0; border-top: 1px solid #E4DFE9; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))"><a href="MobileLead.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #6B3585; text-decoration: none">Leads</a><a href="Inbox.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #5E5566; text-decoration: none">Inbox</a><a href="Tasks.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #5E5566; text-decoration: none">Tasks</a><a href="Calls.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #5E5566; text-decoration: none">Calls</a></nav>
</div>
</x-dc>
