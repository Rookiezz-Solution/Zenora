packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
# Security: force patched versions of transitive dependencies that the pinned
# NestJS 10 / Next packages would otherwise pull in (see docs/SECURITY.md).
overrides:
  multer: ">=2.3.0"
  qs: ">=6.16.0"
  body-parser: ">=1.20.6"
  postcss: ">=8.5.23"
